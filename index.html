<!DOCTYPE html>
<html lang="uk">
<head>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-82WP0WEX34"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-82WP0WEX34');

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#211a14">
<title>Мовні ігри</title>
<link rel="preload" href="fonts/balsamiq-sans-cyrillic-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css?v=20261011">
</head>
<body>

  <!-- Меню -->
  <main id="menu" class="screen">
    <h1 class="title">Що качатимемо?</h1>

    <div class="mode-list">
      <button id="btn-naholosy" class="mode-card mode-main">
        <span class="mode-icon" aria-hidden="true">🗣️</span>
        <span class="mode-text">
          <span class="mode-name">Наголоси</span>
          <span class="mode-best" data-best="naholosy"></span>
        </span>
        <span class="mode-arrow" aria-hidden="true">›</span>
      </button>

      <button id="btn-leksychna" class="mode-card">
        <span class="mode-icon" aria-hidden="true">🔎</span>
        <span class="mode-text">
          <span class="mode-name">Лексична помилка <span class="badge">soon</span></span>
          <span class="mode-best" data-best="leksychna"></span>
        </span>
        <span class="mode-arrow" aria-hidden="true">›</span>
      </button>

      <button id="btn-leaders" class="mode-card">
        <span class="mode-icon" aria-hidden="true">🏆</span>
        <span class="mode-text">
          <span class="mode-name">Турнірна таблиця</span>
        </span>
        <span class="mode-arrow" aria-hidden="true">›</span>
      </button>
    </div>
  </main>

  <!-- Гра -->
  <main id="game" class="screen" hidden>
    <header class="top-bar">
      <button id="btn-menu" class="icon-btn" aria-label="В меню">‹ Меню</button>
      <span id="lives" class="lives" aria-label="Життя"></span>
      <span id="score" class="score">0</span>
    </header>

    <div id="progress" class="progress" hidden>
      <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
    </div>

    <section class="card">
      <p id="question" class="question"></p>
      <div id="sentence" class="sentence" hidden></div>
      <div id="answers" class="answers"></div>
      <p id="feedback" class="feedback" aria-live="polite"></p>
    </section>

    <p id="hint" class="hint"></p>
  </main>

  <!-- Кінець гри -->
  <main id="over" class="screen" hidden>
    <section class="card over-card">
      <div class="over-emoji" aria-hidden="true">🏁</div>
      <h2>Гру закінчено!</h2>
      <p class="over-score"><span id="over-score">0</span></p>
      <p id="over-best" class="over-best"></p>

      <form id="submit-form" class="submit-form" hidden>
        <label for="player-name">Твоє ім'я для турнірної таблиці</label>
        <div class="submit-row">
          <input id="player-name" type="text" maxlength="20" autocomplete="nickname" placeholder="Наприклад, Оксана">
          <button type="submit" class="btn-primary btn-small">Зберегти</button>
        </div>
        <p id="submit-status" class="submit-status" aria-live="polite"></p>
      </form>

      <div class="over-actions">
        <button id="btn-again" class="btn-primary">Ще раз</button>
        <button id="btn-over-menu" class="btn-secondary">В меню</button>
      </div>
    </section>

    <section id="mistakes" class="card mistakes" hidden>
      <h3>Твої помилки</h3>
      <ul id="mistakes-list" class="mistakes-list"></ul>
    </section>
  </main>

  <!-- Турнірна таблиця -->
  <main id="leaders" class="screen" hidden>
    <header class="top-bar">
      <button id="btn-leaders-back" class="icon-btn" aria-label="В меню">‹ Меню</button>
      <h2 class="screen-title">Турнірна таблиця</h2>
    </header>

    <div class="tabs" role="tablist">
      <button class="tab active" data-game="naholosy" role="tab">Наголоси</button>
      <button class="tab" data-game="leksychna" role="tab">Лексична помилка</button>
    </div>

    <section class="card">
      <ol id="leaders-list" class="leaders-list"></ol>
      <p id="leaders-status" class="leaders-status"></p>
    </section>
  </main>

  <!-- Святкування -->
  <div id="celebrate" class="modal" hidden>
    <div class="modal-card">
      <div class="over-emoji" aria-hidden="true">🏆</div>
      <h2>Неймовірно!</h2>
      <p id="celebrate-text"></p>
      <button id="btn-continue" class="btn-primary">Грати далі</button>
    </div>
  </div>
  <div id="confetti" class="confetti" aria-hidden="true"></div>

  <footer class="brand">by @ukr_movych</footer>

  <script src="leaderboard-config.js?v=20261011"></script>
  <script src="script.js?v=20261011"></script>

</body>
</html>
