<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#211a14">
<title>Статистика і відгуки</title>
<link rel="icon" type="image/png" href="../favicon.png">
<style>
@font-face { font-family: 'Balsamiq Sans'; font-weight: 700; font-display: swap; src: url(../fonts/balsamiq-sans-cyrillic-700-normal.woff2) format('woff2'); }
@font-face { font-family: 'Balsamiq Sans'; font-weight: 700; font-display: swap; src: url(../fonts/balsamiq-sans-latin-700-normal.woff2) format('woff2'); unicode-range: U+0000-00FF; }
:root {
  --bg: #211a14; --surface: #2b2219; --surface-2: #362a20; --line: #45372b;
  --orange: #FF7900; --green: #4CAF50; --red: #e0533d; --text: #fff; --muted: #b9a797;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
h1, h2, .big { font-family: 'Balsamiq Sans', system-ui, sans-serif; }
.wrap { max-width: 960px; margin: 0 auto; padding: 20px 16px 48px; }
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
header img { width: 44px; height: 44px; }
h1 { margin: 0; font-size: 26px; flex: 1; }
h2 { font-size: 19px; margin: 28px 0 10px; }
button { font: inherit; cursor: pointer; border: 2px solid var(--line); background: var(--surface-2); color: var(--text); border-radius: 999px; padding: 6px 14px; }
button:hover { border-color: var(--orange); }
button.on { background: var(--orange); border-color: var(--orange); color: #211a14; font-weight: 700; }
.periods { display: flex; gap: 6px; flex-wrap: wrap; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.card .big { font-size: 30px; color: var(--orange); line-height: 1.1; }
.card .label { color: var(--muted); font-size: 14px; }
.panel { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 14px; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: right; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); font-weight: 600; font-size: 13px; }
tr:last-child td { border-bottom: 0; }
.chart { display: flex; align-items: flex-end; gap: 3px; height: 150px; padding-top: 18px; }
.chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; position: relative; }
.chart .bar { width: 100%; max-width: 34px; background: var(--orange); border-radius: 5px 5px 0 0; min-height: 2px; }
.chart .bar.zero { background: var(--line); }
.chart .val { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
.chart-labels { display: flex; gap: 3px; margin-top: 4px; }
.chart-labels span { flex: 1; text-align: center; font-size: 11px; color: var(--muted); min-width: 0; overflow: hidden; }
.legend { font-size: 13px; color: var(--muted); margin: 0 0 6px; }
.rows .row { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
.rows .name { width: 40%; min-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rows .track { flex: 1; background: var(--surface-2); border-radius: 6px; height: 14px; }
.rows .fill { background: var(--orange); height: 100%; border-radius: 6px; }
.rows .n { width: 42px; text-align: right; }
.login { max-width: 360px; margin: 12vh auto 0; text-align: center; }
.login input { width: 100%; font: inherit; font-size: 18px; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--text); margin: 14px 0 10px; text-align: center; }
.login input:focus { outline: none; border-color: var(--orange); }
.login button { width: 100%; padding: 12px; font-size: 17px; }
.error { color: var(--red); min-height: 1.4em; }
.note { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-size: 14px; color: var(--muted); margin-top: 10px; }
.views { display: flex; gap: 6px; margin: 0 0 12px; }
.views button { font-size: 17px; padding: 8px 16px; }
.cl-game { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 0; }
.cl-game summary { cursor: pointer; padding: 12px 14px; list-style: none; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.cl-game summary::-webkit-details-marker { display: none; }
.cl-game summary b { font-size: 17px; }
.cl-game[open] summary { border-bottom: 1px solid var(--line); }
.cl-game .panel { border: 0; border-radius: 0 0 16px 16px; }
.cl-actions { display: flex; gap: 8px; padding: 0 14px 12px; flex-wrap: wrap; }
.fb-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin: 6px 0 12px; }
.fb-tools label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; cursor: pointer; }
.fb-tools input { width: 18px; height: 18px; accent-color: var(--orange); }
.fb-list { display: grid; gap: 10px; }
.fb { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 14px; }
.fb.pub { border-color: rgba(255, 121, 0, .55); }
.fb-text { margin: 0 0 10px; font-size: 17px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
.fb-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; color: var(--muted); font-size: 13px; }
.fb-meta b { color: var(--text); font-weight: 600; }
.fb-meta .tag { background: var(--surface-2); border-radius: 999px; padding: 2px 8px; }
.fb-meta .tag.ok { color: var(--green); }
.fb-meta .tag.no { color: var(--red); }
.fb-meta button { margin-left: auto; padding: 4px 12px; font-size: 13px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <form id="login" class="login" hidden>
    <img src="../logo.png" alt="" width="96" height="96">
    <h1>Статистика гри</h1>
    <input id="password" type="password" placeholder="Пароль" autocomplete="current-password" required>
    <button class="on" type="submit">Увійти</button>
    <p id="login-error" class="error"></p>
    <p class="muted small">Пароль показується внизу, коли запускаєш <b>stats.sql</b> у Supabase.</p>
  </form>

  <main id="dash" hidden>
    <header>
      <img src="../logo.png" alt="">
      <h1>Статистика гри</h1>
      <button id="logout" type="button">Вийти</button>
    </header>
    <div class="views" id="views">
      <button type="button" data-view="stats" class="on">📊 Статистика</button>
      <button type="button" data-view="feedback">💬 Відгуки <span id="fb-count"></span></button>
      <button type="button" data-view="classes">🏫 Класи <span id="cl-count"></span></button>
    </div>
    <div id="stats-view">
    <div class="periods" id="periods">
      <button type="button" data-days="1">Сьогодні</button>
      <button type="button" data-days="7">7 днів</button>
      <button type="button" data-days="30">30 днів</button>
      <button type="button" data-days="90">90 днів</button>
      <button type="button" id="refresh" title="Оновити">↻</button>
    </div>
    <p id="status" class="muted small"></p>
    <div id="content"></div>
    </div>
    <div id="feedback-view" hidden>
      <div class="fb-tools">
        <label><input type="checkbox" id="fb-only-pub" checked> лише ті, що можна публікувати</label>
        <label><input type="checkbox" id="fb-only-good"> лише з оцінкою 4–5</label>
        <span id="fb-summary" class="muted small"></span>
      </div>
      <div id="fb-list" class="fb-list"></div>
    </div>
    <div id="classes-view" hidden>
      <p class="muted small">Ігри для класу: підсумки кожної гри з нікнеймами учнів, датою й часом. Натисни на гру, щоб побачити результати.</p>
      <div id="cl-list" class="fb-list"></div>
    </div>
  </main>

</div>
<script src="../leaderboard-config.js"></script>
<script>
const CFG = window.LEADERBOARD_CONFIG || {};
const GAME_NAMES = {
  naholosy: "🗣️ Наголоси", leksychna: "🔎 Лексична помилка", klychnyi: "📣 Кличний відмінок",
  chyslivnyky: "🔢 Числівники", frazeolohizmy: "💬 Фразеологізми", inshomovni: "🌍 Іншомовні слова"
};
const ONLINE_NAMES = { duel: "⚔️ Онлайн-дуель", sprint: "⏱ Спринт 60 с", class: "🏫 Гра для класу" };
const $ = id => document.getElementById(id);

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }
};

let password = store.get("stats_password") || "";
let days = Number(store.get("stats_days")) || 7;

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
const num = v => (v === null || v === undefined ? "—" : Number(v).toLocaleString("uk-UA"));
const pct = (a, b) => (b ? Math.round(a / b * 100) + "%" : "—");

async function fetchStats() {
  const res = await fetch(`${CFG.url}/rest/v1/rpc/get_stats`, {
    method: "POST",
    headers: { apikey: CFG.anonKey, Authorization: `Bearer ${CFG.anonKey}`, "Content-Type": "application/json" },
    body: JSON.stringify({ p_password: password, p_days: days })
  });
  if (res.ok) return res.json();
  const text = await res.text();
  if (text.includes("wrong password")) throw new Error("password");
  if (res.status === 404 || text.includes("get_stats")) throw new Error("nosql");
  throw new Error("network");
}

// ---------- Відгуки ----------
const ROLE_NAMES = { student: "🎒 учень/учениця", teacher: "👩‍🏫 вчитель/ка", parent: "👨‍👩‍👧 батьки", other: "✨ інше" };
const RATING_EMOJI = ["", "😕", "😐", "🙂", "😃", "🤩"];
let feedback = null;
let view = ["feedback", "classes"].includes(store.get("stats_view")) ? store.get("stats_view") : "stats";

async function fetchFeedback() {
  const res = await fetch(`${CFG.url}/rest/v1/rpc/get_feedback`, {
    method: "POST",
    headers: { apikey: CFG.anonKey, Authorization: `Bearer ${CFG.anonKey}`, "Content-Type": "application/json" },
    body: JSON.stringify({ p_password: password })
  });
  if (res.ok) return res.json();
  const text = await res.text();
  if (text.includes("wrong password")) throw new Error("password");
  if (res.status === 404 || text.includes("get_feedback")) throw new Error("nosql");
  throw new Error("network");
}

async function loadFeedback() {
  try {
    feedback = await fetchFeedback();
    $("fb-count").textContent = feedback.length ? `(${feedback.length})` : "";
    renderFeedback();
  } catch (err) {
    if (err.message === "password") return;
    $("fb-list").innerHTML = err.message === "nosql"
      ? '<p class="note">У Supabase ще немає таблиці відгуків: запусти feedback.sql (див. STATS.md).</p>'
      : '<p class="note">Не вдалося завантажити відгуки. Перевір інтернет.</p>';
  }
}

function feedbackQuote(f) {
  const who = [f.name, f.role === "teacher" ? "вчитель/ка" : f.role === "parent" ? "батьки" : ""].filter(Boolean).join(", ");
  return `«${f.message.trim()}»${who ? ` — ${who}` : ""}`;
}

function renderFeedback() {
  if (!feedback) return;
  const onlyPub = $("fb-only-pub").checked;
  const onlyGood = $("fb-only-good").checked;
  const list = feedback.filter(f => (!onlyPub || f.can_publish) && (!onlyGood || f.rating >= 4));
  const rated = feedback.filter(f => f.rating);
  const avg = rated.length ? (rated.reduce((a, f) => a + f.rating, 0) / rated.length).toFixed(1).replace(".", ",") : "—";
  $("fb-summary").textContent = `Усього: ${feedback.length} · середня оцінка: ${avg} з 5 · показано: ${list.length}`;
  if (!list.length) {
    $("fb-list").innerHTML = `<p class="note">${feedback.length ? "Немає відгуків за цим фільтром." : "Відгуків ще немає. Вони з'являться тут, щойно хтось натисне «Залиш відгук» у грі."}</p>`;
    return;
  }
  $("fb-list").innerHTML = list.map((f, i) => `<article class="fb${f.can_publish ? " pub" : ""}">
    <p class="fb-text">${esc(f.message)}</p>
    <div class="fb-meta">
      ${f.rating ? `<span title="Оцінка ${f.rating} з 5">${RATING_EMOJI[f.rating]} ${f.rating}/5</span>` : ""}
      ${f.name ? `<b>${esc(f.name)}</b>` : '<span>без імені</span>'}
      ${f.role ? `<span class="tag">${ROLE_NAMES[f.role] || esc(f.role)}</span>` : ""}
      ${f.contact ? `<span class="tag">${esc(f.contact)}</span>` : ""}
      <span class="tag ${f.can_publish ? "ok" : "no"}">${f.can_publish ? "✓ можна публікувати" : "✕ не публікувати"}</span>
      <span>${new Date(f.created_at).toLocaleDateString("uk-UA", { day: "numeric", month: "long", year: "numeric" })}${f.source === "telegram" ? " · Telegram" : ""}</span>
      <button type="button" data-copy="${i}">Скопіювати</button>
    </div>
  </article>`).join("");
  $("fb-list").querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", () => {
    navigator.clipboard.writeText(feedbackQuote(list[Number(b.dataset.copy)])).then(() => {
      b.textContent = "Скопійовано ✓";
      setTimeout(() => { b.textContent = "Скопіювати"; }, 1500);
    });
  }));
}

// ---------- Ігри для класу ----------
let classGames = null;

async function loadClasses() {
  try {
    const res = await fetch(`${CFG.url}/rest/v1/rpc/get_class_results`, {
      method: "POST",
      headers: { apikey: CFG.anonKey, Authorization: `Bearer ${CFG.anonKey}`, "Content-Type": "application/json" },
      body: JSON.stringify({ p_password: password })
    });
    const text = await res.text();
    if (!res.ok) throw new Error(res.status === 404 || text.includes("get_class_results") ? "nosql" : "network");
    classGames = JSON.parse(text);
    $("cl-count").textContent = classGames.length ? `(${classGames.length})` : "";
    renderClasses();
  } catch (err) {
    $("cl-list").innerHTML = err.message === "nosql"
      ? '<p class="note">У Supabase ще немає таблиці результатів: запусти class-results.sql (див. STATS.md).</p>'
      : '<p class="note">Не вдалося завантажити результати. Перевір інтернет.</p>';
  }
}

function classCsv(g) {
  const when = new Date(g.started_at || g.ended_at).toLocaleString("uk-UA");
  const rows = [["Гра", GAME_NAMES[g.game] || g.game], ["Кімната", g.room], ["Дата", when],
    ["Питань", `${g.rounds} з ${g.rounds_planned}${g.early ? " (завершено достроково)" : ""}`], [],
    ["Місце", "Ім'я", "Бали", "Правильних відповідей", "Відповідей"],
    ...g.players.map(p => [p.place, p.name, p.score, p.correct, p.answered])];
  return rows.map(r => r.join(";")).join("\n");
}

function renderClasses() {
  if (!classGames) return;
  if (!classGames.length) {
    $("cl-list").innerHTML = '<p class="note">Ігор для класу ще не було. Підсумки з\'являться тут після першої завершеної гри.</p>';
    return;
  }
  $("cl-list").innerHTML = classGames.map((g, i) => {
    const start = new Date(g.started_at || g.ended_at);
    const mins = g.started_at ? Math.max(1, Math.round((new Date(g.ended_at) - start) / 60000)) : null;
    const best = g.players[0];
    return `<details class="cl-game">
      <summary>
        <b>${start.toLocaleDateString("uk-UA", { day: "numeric", month: "long" })}, ${start.toLocaleTimeString("uk-UA", { hour: "2-digit", minute: "2-digit" })}</b>
        <span>${esc(GAME_NAMES[g.game] || g.game)}</span>
        <span class="muted small">кімната ${esc(g.room)} · учнів: ${g.players.length} · питань: ${g.rounds} з ${g.rounds_planned}${g.early ? " (достроково)" : ""}${mins ? ` · ${mins} хв` : ""}</span>
        ${best ? `<span class="muted small">🏆 ${esc(best.name)} — ${num(best.score)}</span>` : ""}
      </summary>
      <div class="panel"><table>
        <tr><th>Місце</th><th>Ім'я</th><th>Бали</th><th>Правильних</th><th>Відповідей</th></tr>
        ${g.players.map(p => `<tr><td>${p.place}</td><td>${esc(p.name)}</td><td>${num(p.score)}</td><td>${num(p.correct)} з ${num(g.rounds)}</td><td>${num(p.answered)}</td></tr>`).join("")}
      </table></div>
      <div class="cl-actions"><button type="button" data-csv="${i}">⬇️ Завантажити таблицю</button></div>
    </details>`;
  }).join("");
  $("cl-list").querySelectorAll("[data-csv]").forEach(b => b.addEventListener("click", () => {
    const g = classGames[Number(b.dataset.csv)];
    const blob = new Blob(["\ufeff" + classCsv(g)], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `klas-${g.room}-${(g.started_at || g.ended_at).slice(0, 10)}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
  }));
}

function setView(v) {
  view = v;
  store.set("stats_view", v);
  document.querySelectorAll("#views button").forEach(b => b.classList.toggle("on", b.dataset.view === v));
  $("stats-view").hidden = v !== "stats";
  $("feedback-view").hidden = v !== "feedback";
  $("classes-view").hidden = v !== "classes";
}

function showLogin(message = "") {
  $("dash").hidden = true;
  $("login").hidden = false;
  $("login-error").textContent = message;
  $("password").focus();
}

async function load() {
  $("login").hidden = true;
  $("dash").hidden = false;
  setView(view);
  loadFeedback();
  loadClasses();
  document.querySelectorAll("#periods [data-days]").forEach(b => b.classList.toggle("on", Number(b.dataset.days) === days));
  $("status").textContent = "Завантажую…";
  try {
    const s = await fetchStats();
    render(s);
    $("status").textContent = `Оновлено о ${new Date().toLocaleTimeString("uk-UA", { hour: "2-digit", minute: "2-digit" })}`;
  } catch (err) {
    if (err.message === "password") {
      store.set("stats_password", null);
      password = "";
      showLogin("Неправильний пароль");
    } else if (err.message === "nosql") {
      $("content").innerHTML = "";
      $("status").textContent = "У Supabase ще немає функції статистики: запусти stats.sql (див. STATS.md).";
    } else {
      $("status").textContent = "Не вдалося завантажити. Перевір інтернет і натисни ↻";
    }
  }
}

function chart(items, key, labelFn) {
  const max = Math.max(1, ...items.map(i => i[key]));
  const bars = items.map(i => `<div class="col" title="${esc(labelFn(i, true))}: ${i[key]}">
      ${i[key] ? `<span class="val">${i[key]}</span>` : ""}
      <div class="bar${i[key] ? "" : " zero"}" style="height:${i[key] / max * 100}%"></div></div>`).join("");
  const step = Math.ceil(items.length / 12);
  const labels = items.map((i, n) => `<span>${n % step === 0 ? esc(labelFn(i)) : ""}</span>`).join("");
  return `<div class="chart">${bars}</div><div class="chart-labels">${labels}</div>`;
}

function rows(list) {
  const max = Math.max(1, ...list.map(r => r.n));
  return `<div class="rows">${list.map(r => `<div class="row"><span class="name">${esc(r.name)}</span>
    <span class="track"><span class="fill" style="display:block;width:${r.n / max * 100}%"></span></span>
    <span class="n">${num(r.n)}</span></div>`).join("")}</div>`;
}

function card(value, label) {
  return `<div class="card"><div class="big">${value}</div><div class="label">${label}</div></div>`;
}

function render(s) {
  const p = s.players, v = s.visits;
  const period = days === 1 ? "сьогодні" : `за ${days} днів`;
  let html = `<h2>Люди ${period}</h2><div class="cards">
    ${card(num(p.period), "гравців (пристроїв)")}
    ${card(num(p.new), "з них нових")}
    ${days > 1 ? card(num(p.returning), "приходили у 2+ різні дні") : ""}
    ${card(num(p.played), "почали хоч одну гру")}
    ${card(num(v.total), `відкриттів гри<br><span class="small">з них у Telegram: ${pct(v.telegram, v.total)}</span>`)}
    ${days > 1 ? card(num(p.today), "гравців сьогодні") : ""}
    ${card(num(p.all_time), "гравців за весь час")}
  </div>`;

  if (days > 1) {
    const dayLabel = (d, full) => {
      const dt = new Date(d.day + "T12:00:00");
      return full ? dt.toLocaleDateString("uk-UA", { weekday: "short", day: "numeric", month: "long" })
        : dt.toLocaleDateString("uk-UA", { day: "numeric", month: "numeric" });
    };
    html += `<h2>По днях</h2><div class="panel"><p class="legend">Гравців за день</p>${chart(s.daily, "players", dayLabel)}
      <p class="legend" style="margin-top:16px">Розпочатих ігор за день (марафони, тренування, дуелі)</p>${chart(s.daily, "games", dayLabel)}</div>`;
  }

  const games = Object.entries(s.games || {}).filter(([id]) => id !== "null");
  const played = games.filter(([, g]) => g.players || g.marathons || g.trainings || g.duels);
  if (played.length) {
    html += `<h2>Ігри</h2><div class="panel"><table>
      <tr><th>Гра</th><th>Гравців</th><th>Марафонів</th><th>Сер. рахунок</th><th>Рекорд</th><th>Тренувань</th><th>з них до кінця</th><th>Дуелей</th><th>Усі слова 🎉</th><th>У таблицю</th></tr>
      ${played.sort((a, b) => b[1].players - a[1].players).map(([id, g]) => `<tr>
        <td>${esc(GAME_NAMES[id] || id)}</td><td>${num(g.players)}</td><td>${num(g.marathons)}</td>
        <td>${num(g.avg_score)}</td><td>${num(g.max_score)}</td><td>${num(g.trainings)}</td><td>${num(g.trainings_done)}</td>
        <td>${num(g.duels)}</td><td>${num(g.all_words)}</td><td>${num(g.leaderboard)}</td></tr>`).join("")}
    </table></div>`;
  }

  if (s.groups && s.groups.length) {
    html += `<h2>Найпопулярніші групи тренувань</h2><div class="panel">${rows(s.groups.map(g => ({ name: g.group, n: g.count })))}</div>`;
  }

  const duelPlayers = Object.entries(s.duel_players || {});
  if (duelPlayers.length) {
    html += `<h2>Дуелі на одному телефоні</h2><div class="panel">${rows(duelPlayers.sort((a, b) => a[0] - b[0]).map(([n, c]) => ({ name: `${n} гравці`, n: c })))}</div>`;
  }

  const online = Object.entries(s.online || {});
  const ox = s.online_extra || {};
  if (online.length || ox.joins || ox.shares) {
    html += `<h2>Онлайн-режими</h2><div class="panel"><table>
      <tr><th>Режим</th><th>Створено кімнат</th><th>Почато ігор</th><th>Дограно</th><th>Гравців у середньому</th><th>Найбільша гра</th></tr>
      ${online.map(([m, o]) => `<tr><td>${esc(ONLINE_NAMES[m] || m)}</td><td>${num(o.created)}</td><td>${num(o.started)}</td>
        <td>${num(o.finished)}</td><td>${num(o.avg_players)}</td><td>${num(o.max_players)}</td></tr>`).join("")}
    </table>
    <p class="note">Надіслали запрошення: <b>${num(ox.shares)}</b> · відкрили гру за запрошенням: <b>${num(ox.invites)}</b> · приєдналися до кімнати: <b>${num(ox.joins)}</b></p></div>`;
  }

  const soon = games.filter(([, g]) => g.soon_clicks).sort((a, b) => b[1].soon_clicks - a[1].soon_clicks);
  if (soon.length) {
    html += `<h2>Яких ігор чекають</h2><p class="muted small">Скільки разів натиснули на гру з позначкою «скоро»</p>
      <div class="panel">${rows(soon.map(([id, g]) => ({ name: GAME_NAMES[id] || id, n: g.soon_clicks })))}</div>`;
  }

  if (s.hours && s.hours.some(h => h.games)) {
    html += `<h2>О котрій грають</h2><div class="panel"><p class="legend">Розпочатих ігор за годиною (київський час)</p>
      ${chart(s.hours, "games", (h, full) => full ? `${h.hour}:00–${h.hour}:59` : String(h.hour))}</div>`;
  }

  const lb = Object.entries(s.leaderboard || {});
  if (lb.length) {
    html += `<h2>Турнірна таблиця</h2><div class="panel"><table>
      <tr><th>Гра</th><th>Гравців у таблиці</th><th>Нових ${period}</th><th>Найкращий результат</th></tr>
      ${lb.map(([id, l]) => `<tr><td>${esc(GAME_NAMES[id] || id)}</td><td>${num(l.players)}</td><td>${num(l.new)}</td><td>${num(l.best)}</td></tr>`).join("")}
    </table></div>`;
  }

  html += `<p class="note">«Гравець» — це один пристрій (телефон чи браузер). Імен і особистих даних гра не збирає.
    Статистика тут рахується з моменту, коли в Supabase запустили <b>stats.sql</b>; давніші дані є лише в Google Analytics.</p>`;
  $("content").innerHTML = html;
}

$("login").addEventListener("submit", e => {
  e.preventDefault();
  password = $("password").value.trim();
  store.set("stats_password", password);
  load();
});
$("logout").addEventListener("click", () => {
  store.set("stats_password", null);
  password = "";
  $("password").value = "";
  showLogin();
});
$("views").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (b) setView(b.dataset.view);
});
$("fb-only-pub").addEventListener("change", renderFeedback);
$("fb-only-good").addEventListener("change", renderFeedback);
$("periods").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.days) { days = Number(b.dataset.days); store.set("stats_days", String(days)); }
  load();
});

if (!CFG.url || !CFG.anonKey) {
  document.body.innerHTML = '<p class="wrap">Supabase не налаштовано (leaderboard-config.js).</p>';
} else if (password) {
  load();
} else {
  showLogin();
}
</script>
</body>
</html>
