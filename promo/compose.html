<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:B;font-weight:700;src:url(../fonts/balsamiq-sans-cyrillic-700-normal.woff2);unicode-range:U+0400-04FF,U+2116}
@font-face{font-family:B;font-weight:700;src:url(../fonts/balsamiq-sans-latin-700-normal.woff2)}
html,body{margin:0}
body{width:1080px;height:1920px;overflow:hidden;font-family:B,"Noto Color Emoji";color:#fff;position:relative;background:linear-gradient(160deg,#ff9418 0%,#ff7900 45%,#ea5600 100%)}
#dots{position:absolute;left:-100px;top:-100px;width:1300px;height:2200px;background-image:radial-gradient(rgba(255,255,255,.15) 3px,transparent 3.5px);background-size:44px 44px}
.blob{position:absolute;border-radius:50%;filter:blur(10px)}
#b1{width:900px;height:900px;background:radial-gradient(circle,rgba(255,226,150,.55),rgba(255,226,150,0) 65%)}
#b2{width:700px;height:700px;background:radial-gradient(circle,rgba(200,60,0,.45),rgba(200,60,0,0) 65%)}
#logo{position:absolute;right:56px;top:60px;width:110px;height:110px;border-radius:50%;border:6px solid #fff;box-shadow:0 7px 0 #211a14}
.cap{position:absolute;left:64px;right:200px;top:66px}
.pill{display:inline-block;padding:10px 28px;border-radius:999px;background:#211a14;color:#ffc46b;font-size:40px;box-shadow:0 7px 0 rgba(33,26,20,.35)}
.cap h1{margin:24px 0 0;font-size:74px;line-height:1.1;text-shadow:0 6px 0 #211a14,6px 6px 0 #211a14,-2px 6px 0 #211a14;-webkit-text-stroke:3px #211a14;paint-order:stroke fill}
.cap.big h1{font-size:118px}
#phone{position:absolute;left:222px;top:520px;width:600px;height:1298px;border:18px solid #211a14;border-radius:72px;background:#211a14;box-shadow:26px 32px 0 rgba(33,26,20,.3);transform-origin:50% 0}
#screen{position:absolute;inset:0;overflow:hidden;border-radius:54px;background:#211a14}
.layer{position:absolute;left:0;top:0;width:600px;height:1298px;overflow:hidden}
.layer img{position:absolute;left:0;top:0;width:600px}
.layer .shade{position:absolute;inset:0;background:#000;opacity:0}
.ring{position:absolute;border:6px solid #ffc46b;border-radius:22px;box-shadow:0 0 0 6px rgba(255,196,107,.35),0 0 40px rgba(255,196,107,.8);pointer-events:none}
#cursor{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;background:rgba(255,255,255,.82);border:6px solid #FF7900;box-shadow:0 8px 20px rgba(0,0,0,.45)}
.ripple{position:absolute;border-radius:50%;border:6px solid #fff;pointer-events:none}
#bubble{position:absolute;left:150px;width:780px;padding:26px 34px 30px;border-radius:36px 36px 36px 8px;background:#fff;color:#211a14;box-shadow:0 14px 0 rgba(33,26,20,.3);font-size:36px;line-height:1.3;transform-origin:0 100%}
#bubble small{display:block;color:#FF7900;font-size:30px;margin-bottom:6px}
#bubble u{color:#2a7de1;text-decoration:none}
#bubble .tm{position:absolute;right:26px;bottom:12px;font-size:22px;color:#9a8f86}
.spark{position:absolute;width:22px;height:22px;border-radius:50%}
#cta{position:absolute;left:50%;top:450px;padding:26px 54px;border-radius:999px;background:#211a14;color:#fff;font-size:70px;white-space:nowrap;box-shadow:0 12px 0 rgba(33,26,20,.35);transform-origin:50% 50%}
#cta b{color:#ffc46b}
#ctaSub{position:absolute;left:0;right:0;top:640px;text-align:center;font-size:44px;color:#211a14}
#fade{position:absolute;inset:0;background:#ff7900;opacity:0}
</style></head><body>
<div id="dots"></div><div class="blob" id="b1"></div><div class="blob" id="b2"></div>
<img id="logo" src="../logo.png">
<div id="caps"></div>
<div id="phone"><div id="screen"></div></div>
<div id="fx"></div>
<div id="bubble"><small>11-Б 💬 Оксана</small>Го в наш клас у НМТ-качалці! Хто більше набере? 😏<br><u>t.me/ukrmovych_bot/battle?startapp=c_482615</u><span class="tm">19:42</span></div>
<div id="cta">👉 <b>@ukrmovych_bot</b></div>
<div id="ctaSub">Наголоси · Лексична помилка · Тест НМТ…</div>
<div id="fade"></div>
<script>
const META = META_JSON;
const k = 600 / 390, VIEW = 844;
const $ = id => document.getElementById(id);
const clamp = x => Math.max(0, Math.min(1, x));
const eio = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eout = x => 1 - Math.pow(1 - clamp(x), 3);
const eback = x => { x = clamp(x); const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const prog = (t, a, b) => clamp((t - a) / (b - a));

// ---------- сценарій ----------
// кадри телефону: t0 — початок, img — назва знімка (або [[t, назва], …] для набору тексту), scroll — [[t, y]] у px сторінки
// tr — як цей кадр з'являється: push (зсув справа), fade, zoom
const SHOTS = [];
const shot = o => (SHOTS.push(o), o);
const typing = (t, prefix, n, step = .15) => Array.from({ length: n }, (_, i) => [t + i * step, prefix + (i + 1)]);
const EVENTS = []; // для звуку
const ev = (t, type) => EVENTS.push({ t: +t.toFixed(3), type });

shot({ t0: 0, img: 'menu', scroll: [[0, 0]] });
shot({ t0: 5.6, tr: 'push', img: [[5.6, 'create0'], ...typing(10.1, 'cA', 4), ...typing(11.3, 'cB', 6)], scroll: [[8.7, 0], [9.6, 436]] });
shot({ t0: 13, tr: 'push', img: 'code', scroll: [[0, 0]] });
shot({ t0: 19.5, tr: 'fade', img: 'qr', scroll: [[19.7, 0], [20.5, 70]] });
shot({ t0: 22, tr: 'zoom', img: [[22, 'inv0'], ...typing(23.3, 'iA', 6)], scroll: [[0, 0]] });
shot({ t0: 25, tr: 'push', img: 'table', scroll: [[25.8, 0], [27.6, 264]] });
shot({ t0: 28.7, tr: 'fade', img: 'leks', scroll: [[0, 264]] });
const TR = { push: .55, fade: .35, zoom: .6 };

const CAPS = [
  { t: 0.3, pill: 'НОВЕ В НМТ-КАЧАЛЦІ', h: '👥 Мій клас', big: 1 },
  { t: 2.6, pill: 'Крок 1', h: 'Натисни «👥 Мій клас» з позначкою «НОВЕ!»' },
  { t: 5.6, pill: 'Що це?', h: 'Тут коротко — чим крутий «Мій клас» 😎' },
  { t: 8, pill: 'Крок 2', h: 'Напиши назву класу й своє ім\'я' },
  { t: 13, pill: 'Крок 3', h: 'Готово! Ось код твого класу 🎉' },
  { t: 15.2, pill: 'Крок 4', h: '«📨 Запросити» — кинь посилання в чат класу' },
  { t: 18.5, pill: 'Крок 4', h: '…або покажи QR-код 👇' },
  { t: 22, pill: 'Крок 5', h: 'Однокласник відкриває посилання й пише ім\'я' },
  { t: 25, pill: 'Крок 6', h: 'Грайте як завжди — рекорди самі летять у таблицю 🔥' },
  { t: 30.8, pill: 'ТВОЯ ЧЕРГА', h: 'Створи свій клас і поклич однокласників! 💪' },
];

// що тапаємо: [час, кадр, елемент]; курсор підлітає до кожного
const TAPS = [
  [5.3, 'menu', 'btn'], [9.9, 'create0', 'i1', .85], [11.1, 'create0', 'i2', .85], [12.7, 'create0', 'go'],
  [16.4, 'code', 'inv'], [19.3, 'code', 'qr'], [23.1, 'inv0', 'inp', .85], [24.7, 'inv0', 'go'], [28.5, 'table', 'tab1'],
];
const CURSOR_ON = [[4.3, 5.6], [9.2, 13], [15.6, 19.6], [22.4, 25], [27.8, 28.9]];
const RINGS = [[3.9, 5.35, 'menu', 'btn', 8], [13.4, 15.1, 'code', 'code', 10], [15.3, 16.45, 'code', 'inv', 6], [18.6, 19.35, 'code', 'qr', 6]];
const SPARKS = [[13.35, 'code', 'code'], [28.8, 'leks', 'tabs']];

// ---------- обчислення ----------
function scrollAt(s, t) {
  const kf = s.scroll; if (kf.length === 1 || t <= kf[0][0]) return kf[0][1];
  for (let i = 1; i < kf.length; i++) if (t <= kf[i][0]) return lerp(kf[i - 1][1], kf[i][1], eio(prog(t, kf[i - 1][0], kf[i][0])));
  return kf[kf.length - 1][1];
}
function imgAt(s, t) { if (typeof s.img === 'string') return s.img; let n = s.img[0][1]; for (const [a, m] of s.img) if (t >= a) n = m; return n; }
function shotIdx(t) { let i = 0; SHOTS.forEach((s, j) => { if (t >= s.t0) i = j; }); return i; }
function shotByImg(name) { return SHOTS.find(s => s.img === name || (Array.isArray(s.img) && s.img.some(x => x[1] === name))); }
// центр елемента на екрані телефону в момент t
function pt(t, img, key, fx = .5) {
  const r = META[img].r[key], s = shotByImg(img);
  return { x: (r.x + r.w * fx) * k, y: (r.y + r.h / 2 - scrollAt(s, t)) * k, r };
}
TAPS.forEach(([t]) => ev(t, 'tap'));
SHOTS.forEach(s => { if (s.tr) ev(s.t0, s.tr === 'fade' ? 'soft' : 'whoosh'); if (Array.isArray(s.img)) s.img.slice(1).forEach(([t]) => ev(t, 'key')); });
ev(0.35, 'whoosh'); ev(13.35, 'chime'); ev(16.55, 'pop'); ev(28.8, 'chime'); ev(31.7, 'tada');
CAPS.slice(1).forEach(c => ev(c.t, 'cap'));

// ---------- DOM ----------
const layers = {};
for (const n in META) {
  const d = document.createElement('div'); d.className = 'layer';
  d.innerHTML = `<img src="work/v/s6/${n}.png"><div class="shade"></div>`;
  d.style.display = 'none'; $('screen').appendChild(d); layers[n] = d;
}
const capEls = CAPS.map(c => {
  const d = document.createElement('div'); d.className = 'cap' + (c.big ? ' big' : '');
  d.innerHTML = `<span class="pill">${c.pill}</span><h1>${c.h}</h1>`; $('caps').appendChild(d); return d;
});
const cursor = document.createElement('div'); cursor.id = 'cursor'; $('screen').appendChild(cursor);
const ringEl = document.createElement('div'); ringEl.className = 'ring'; $('screen').appendChild(ringEl);
const ripples = TAPS.map(() => { const d = document.createElement('div'); d.className = 'ripple'; $('screen').appendChild(d); return d; });
const sparks = [];
SPARKS.forEach(([t, img, key]) => {
  for (let i = 0; i < 18; i++) {
    const d = document.createElement('div'); d.className = 'spark';
    d.style.background = ['#ffc46b', '#fff', '#FF7900', '#7ee081'][i % 4];
    $('screen').appendChild(d);
    sparks.push({ d, t, img, key, a: i / 18 * Math.PI * 2 + (i % 3) * .2, v: 160 + (i * 37) % 120 });
  }
});

function setLayer(name, t, s, x, y, sc, shade, op) {
  const d = layers[name]; d.style.display = 'block';
  d.style.transform = `translate(${x}px,${y}px) scale(${sc})`; d.style.opacity = op;
  d.firstChild.style.transform = `translateY(${-scrollAt(s, t) * k}px)`;
  d.lastChild.style.opacity = shade;
}

function render(t) {
  // фон
  $('dots').style.transform = `translate(${(t * 14) % 44}px,${(t * 22) % 44}px)`;
  $('b1').style.transform = `translate(${380 + Math.sin(t * .35) * 220}px,${1150 + Math.cos(t * .27) * 260}px)`;
  $('b2').style.transform = `translate(${-200 + Math.cos(t * .3) * 160}px,${300 + Math.sin(t * .22) * 200}px)`;
  $('logo').style.transform = `rotate(${Math.sin(t * 1.6) * 6}deg) scale(${1 + .12 * Math.max(0, 1 - Math.abs(t - 31.8) * 3) + (t < .8 ? 0 : 0)})`;
  $('logo').style.opacity = eout(prog(t, .1, .6));

  // підписи
  CAPS.forEach((c, i) => {
    const nx = CAPS[i + 1] ? CAPS[i + 1].t : 1e9, el = capEls[i];
    const pin = prog(t, c.t, c.t + .55), pout = prog(t, nx - .3, nx);
    if (t < c.t || pout >= 1) { el.style.display = 'none'; return; }
    el.style.display = 'block';
    const pill = el.firstChild, h = el.lastChild;
    pill.style.transform = `translateX(${(1 - eback(prog(t, c.t, c.t + .4))) * -500}px)`;
    h.style.transform = `translateY(${(1 - eback(prog(t, c.t + .08, c.t + .6))) * 60}px) scale(${lerp(.85, 1, eback(prog(t, c.t + .08, c.t + .6)))})`;
    h.style.opacity = eout(prog(t, c.t + .08, c.t + .4));
    el.style.opacity = 1 - pout; el.style.transform = `translateY(${-pout * 50}px)`;
  });

  // телефон: виїжджає знизу на початку, наприкінці зменшується
  const pin = eback(prog(t, .5, 1.5)), pend = eio(prog(t, 30.7, 31.6));
  const py = lerp(1500, 0, pin) + Math.sin(t * 1.1) * 6 + pend * 250;
  const zin = eio(prog(t, 6.1, 6.8)) * (1 - eio(prog(t, 8.1, 8.7))); // наближення до пояснення «чим крутий»
  $('phone').style.transform = `translateY(${py - zin * 40}px) rotate(${lerp(6, 0, pin) + pend * -3}deg) scale(${lerp(1, .62, pend) * (1 + zin * .4)})`;
  $('phone').style.opacity = 1 - eio(prog(t, 35, 35.7));

  // екран
  for (const n in layers) layers[n].style.display = 'none';
  const i = shotIdx(t), s = SHOTS[i], p = s.tr ? prog(t, s.t0, s.t0 + TR[s.tr]) : 1;
  if (p < 1) {
    const prev = SHOTS[i - 1], pn = imgAt(prev, t), e = eio(p);
    if (s.tr === 'push') { setLayer(pn, t, prev, -e * 200, 0, 1, e * .55, 1); setLayer(imgAt(s, t), t, s, (1 - e) * 600, 0, 1, 0, 1); layers[imgAt(s, t)].style.boxShadow = '-20px 0 40px rgba(0,0,0,.5)'; }
    if (s.tr === 'fade') { setLayer(pn, t, prev, 0, 0, 1, 0, 1); setLayer(imgAt(s, t), t, s, 0, 0, 1, 0, e); }
    if (s.tr === 'zoom') { setLayer(pn, t, prev, 0, 0, lerp(1, .85, e), e * .7, 1 - e); setLayer(imgAt(s, t), t, s, 0, 0, lerp(1.15, 1, e), 0, e); }
  } else setLayer(imgAt(s, t), t, s, 0, 0, 1, 0, 1);

  // рамка-підсвітка
  ringEl.style.display = 'none';
  RINGS.forEach(([a, b, img, key, pad]) => {
    if (t < a || t > b) return;
    const q = pt(t, img, key), r = q.r, o = eout(prog(t, a, a + .3)) * (1 - prog(t, b - .2, b));
    const pulse = 1 + Math.sin((t - a) * 7) * .025;
    Object.assign(ringEl.style, { display: 'block', left: (r.x - pad) * k + 'px', top: (r.y - pad) * k - scrollAt(shotByImg(img), t) * k + 'px', width: (r.w + pad * 2) * k + 'px', height: (r.h + pad * 2) * k + 'px', opacity: o, transform: `scale(${pulse})` });
  });

  // курсор
  const on = CURSOR_ON.find(([a, b]) => t >= a && t <= b);
  cursor.style.display = on ? 'block' : 'none';
  if (on) {
    const taps = TAPS.filter(([tt]) => tt >= on[0] - .01 && tt <= on[1] + .01);
    let x = 470, y = 1150; // звідки заходить
    let prevT = on[0];
    for (const [tt, img, key, fx] of taps) {
      const q = pt(Math.min(tt, t), img, key, fx), m = eio(prog(t, Math.max(prevT, tt - .75), tt - .12));
      x = lerp(x, q.x, m); y = lerp(y, q.y, m); prevT = tt + .15;
      if (t < tt) break;
    }
    let press = 1; taps.forEach(([tt]) => { const d = t - tt; if (d > -.08 && d < .25) press = Math.min(press, .72 + .28 * Math.abs(d < 0 ? d / .08 : d / .25)); });
    const o = eout(prog(t, on[0], on[0] + .3)) * (1 - prog(t, on[1] - .25, on[1]));
    Object.assign(cursor.style, { left: x + 'px', top: y + 'px', opacity: o, transform: `scale(${press * lerp(1.5, 1, eout(prog(t, on[0], on[0] + .3)))})` });
  }
  TAPS.forEach(([tt, img, key, fx], j) => {
    const d = prog(t, tt, tt + .55), el = ripples[j];
    if (t < tt || d >= 1) { el.style.display = 'none'; return; }
    const q = pt(tt, img, key, fx), R = lerp(20, 140, eout(d));
    Object.assign(el.style, { display: 'block', left: q.x - R + 'px', top: q.y - R + 'px', width: R * 2 + 'px', height: R * 2 + 'px', opacity: 1 - d, borderWidth: lerp(10, 2, d) + 'px' });
  });

  // іскри
  sparks.forEach(sp => {
    const d = prog(t, sp.t, sp.t + .9);
    if (t < sp.t || d >= 1) { sp.d.style.display = 'none'; return; }
    const q = pt(t, sp.img, sp.key), dist = sp.v * eout(d) * 1.6;
    Object.assign(sp.d.style, { display: 'block', left: q.x + Math.cos(sp.a) * dist * 1.4 - 11 + 'px', top: q.y + Math.sin(sp.a) * dist + 40 * d * d - 11 + 'px', opacity: 1 - d * d, transform: `scale(${1 - d * .6})` });
  });

  // повідомлення в чат класу
  const bi = prog(t, 16.55, 17), bo = prog(t, 18.3, 18.6);
  $('bubble').style.display = t > 16.55 && bo < 1 ? 'block' : 'none';
  $('bubble').style.top = '980px';
  $('bubble').style.transform = `translateY(${(1 - eout(bi)) * 80 - eio(bo) * 60}px) scale(${lerp(.3, 1, eback(bi)) * (1 - bo * .1)})`;
  $('bubble').style.opacity = clamp(bi * 3) * (1 - bo);

  // фінал
  const ci = prog(t, 31.7, 32.3);
  $('cta').style.display = t > 31.7 ? 'block' : 'none';
  $('cta').style.transform = `translateX(-50%) scale(${eback(ci) * (1 + Math.sin(Math.max(0, t - 32.4) * 4) * .03)})`;
  $('ctaSub').style.opacity = eout(prog(t, 32.2, 32.8));
  $('ctaSub').style.transform = `translateY(${(1 - eout(prog(t, 32.2, 32.8))) * 30}px)`;
  $('fade').style.opacity = 0;
}
window.render = render; window.EVENTS = EVENTS; window.DURATION = 35.9;
</script></body></html>
