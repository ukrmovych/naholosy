<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:B;font-weight:700;src:url(../fonts/balsamiq-sans-cyrillic-700-normal.woff2);unicode-range:U+0400-04FF,U+2116}
@font-face{font-family:B;font-weight:700;src:url(../fonts/balsamiq-sans-latin-700-normal.woff2)}
html,body{margin:0}
body{width:1080px;height:1350px;overflow:hidden;font-family:B,"Noto Color Emoji";color:#fff;position:relative;
 background:radial-gradient(circle at 80% 85%,rgba(255,226,150,.6) 0,rgba(255,140,0,0) 520px),linear-gradient(150deg,#ff9418 0%,#ff7900 45%,#ea5600 100%)}
body:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 3px,transparent 3.5px);background-size:44px 44px}
.top{position:absolute;left:70px;right:70px;top:64px}
.step{display:inline-block;padding:10px 26px;border-radius:999px;background:#211a14;color:#ffc46b;font-size:38px;box-shadow:0 7px 0 rgba(33,26,20,.35)}
h1{margin:26px 0 0;font-size:66px;line-height:1.12;text-shadow:0 6px 0 #211a14,6px 6px 0 #211a14,-2px 6px 0 #211a14;-webkit-text-stroke:3px #211a14;paint-order:stroke fill}
p.sub{margin:18px 0 0;font-size:36px;line-height:1.3;color:#211a14}
.phone{position:absolute;left:50%;bottom:-80px;width:470px;transform:translateX(-50%) rotate(-2deg);border-radius:56px;border:16px solid #211a14;box-shadow:24px 30px 0 rgba(33,26,20,.3);overflow:hidden;background:#211a14}
.phone img{display:block;width:100%}
.logo{position:absolute;right:60px;top:56px;width:96px;height:96px;border-radius:50%;border:6px solid #fff;box-shadow:0 6px 0 #211a14}
.cover h1{font-size:96px;margin-top:30px}
.cover .phone{bottom:-140px}
</style></head><body>
<img class="logo" src="../logo.png">
<div class="top"><span class="step" id="step"></span><h1 id="t"></h1><p class="sub" id="s"></p></div>
<div class="phone"><img id="img"></div>
<script>
const P = new URLSearchParams(location.search);
document.getElementById('step').textContent = P.get('step');
document.getElementById('t').innerHTML = P.get('t');
document.getElementById('s').textContent = P.get('s');
document.getElementById('img').src = P.get('img');
if (P.get('cover')) document.body.classList.add('cover');
const imgEl = document.getElementById('img');
if (P.get('crop')) { imgEl.parentElement.style.height = P.get('crop') + 'px'; }
</script></body></html>
