<!doctype html><html><head><meta charset="utf-8"><style>
/* Відео «233/233» (марафон «Наголосів»): той самий стиль, що compose.html, але приглушений теплий фон і без підписів — місце вгорі лишається порожнім */
@font-face{font-family:B;font-weight:700;src:url(../fonts/balsamiq-sans-cyrillic-700-normal.woff2);unicode-range:U+0400-04FF,U+2116}
@font-face{font-family:B;font-weight:700;src:url(../fonts/balsamiq-sans-latin-700-normal.woff2)}
html,body{margin:0}
body{width:1080px;height:1920px;overflow:hidden;font-family:B,"Noto Color Emoji";color:#fff;position:relative;background:linear-gradient(160deg,#b8692f 0%,#9c5124 45%,#7a3a17 100%)}
#dots{position:absolute;left:-100px;top:-100px;width:1300px;height:2200px;background-image:radial-gradient(rgba(255,226,180,.10) 3px,transparent 3.5px);background-size:44px 44px}
.blob{position:absolute;border-radius:50%;filter:blur(10px)}
#b1{width:900px;height:900px;background:radial-gradient(circle,rgba(255,190,110,.32),rgba(255,190,110,0) 65%)}
#b2{width:700px;height:700px;background:radial-gradient(circle,rgba(60,20,5,.40),rgba(60,20,5,0) 65%)}
#logo{position:absolute;right:56px;top:60px;width:110px;height:110px;border-radius:50%;border:6px solid #fff;box-shadow:0 7px 0 #211a14}
#phone{position:absolute;left:222px;top:700px;width:600px;height:1298px;border:18px solid #211a14;border-radius:72px;background:#211a14;box-shadow:26px 32px 0 rgba(33,26,20,.35);transform-origin:50% 30%}
#screen{position:absolute;inset:0;overflow:hidden;border-radius:54px;background:#211a14}
.layer{position:absolute;left:0;top:0;width:600px;height:1298px;overflow:hidden}
.layer img{position:absolute;left:0;top:0;width:600px}
.layer .shade{position:absolute;inset:0;background:#000;opacity:0}
#cursor{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;background:rgba(255,255,255,.82);border:6px solid #FF7900;box-shadow:0 8px 20px rgba(0,0,0,.45)}
.ripple{position:absolute;border-radius:50%;border:6px solid #fff;pointer-events:none}
.spark{position:absolute;width:22px;height:22px;border-radius:50%}
#chip{position:absolute;left:540px;top:600px;padding:14px 40px;border-radius:999px;background:#211a14;color:#fff;font-size:62px;white-space:nowrap;box-shadow:0 10px 0 rgba(33,26,20,.35);transform-origin:50% 50%}
#chip b{color:#ffc46b}
#ff{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none}
.conf{position:absolute;width:22px;height:34px;border-radius:5px}
</style></head><body>
<div id="dots"></div><div class="blob" id="b1"></div><div class="blob" id="b2"></div>
<img id="logo" src="../logo.png">
<div id="phone"><div id="screen"></div></div>
<div id="chip"></div>
<div id="cf"></div>
<script>
const DATA = META_JSON, META = DATA.meta;
const k = 600 / 390;
const $ = id => document.getElementById(id);
const clamp = x => Math.max(0, Math.min(1, x));
const eio = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eout = x => 1 - Math.pow(1 - clamp(x), 3);
const eback = x => { x = clamp(x); const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const prog = (t, a, b) => clamp((t - a) / (b - a));

// ---------- сценарій ----------
// SEQ: [час, знімок, тривалість переходу, вид (fade|push|zoom)]; TAPS: [час, знімок із кнопкою]
const SEQ = [], TAPS = [], EVENTS = [], SCORE = []; // SCORE: [час, рахунок] для плашки
const ev = (t, type) => EVENTS.push({ t: +t.toFixed(3), type });
const word = (t, n, period) => { // одне слово «наживо»: питання → тап → відповідь
  SEQ.push([t, 'q' + n, .14, 'fade']); TAPS.push([t + period * .55, 'q' + n]);
  SEQ.push([t + period * .55, 'a' + n, .06, 'fade']); SCORE.push([t + period * .55, n]);
  ev(t + period * .55 + .04, 'soft');
};
SEQ.push([0, 'modes', 0]);
TAPS.push([1.7, 'modes']);
SEQ.push([1.85, 'q1', .5, 'push']);
let t = 2.35; const P1 = .85;
TAPS.push([t + P1 * .55, 'q1']); SEQ.push([t + P1 * .55, 'a1', .06, 'fade']); SCORE.push([t + P1 * .55, 1]); ev(t + P1 * .55 + .04, 'soft'); t += P1;
for (let n = 2; n <= DATA.FIRST; n++, t += P1) word(t, n, P1);
// перемотка: кадри дедалі частіше, потім знову рідше
const FF_START = t, FF_DUR = 4.6, F = DATA.FF;
const w = F.map((_, i) => 1 + 2.6 * Math.sin(Math.PI * (i + .5) / F.length)); const W = w.reduce((a, b) => a + b);
let acc = 0;
F.forEach((n, i) => {
  const tt = FF_START + FF_DUR * acc / W; acc += 1 / w[i];
  TAPS.push([tt, 'a' + n, 1]); SEQ.push([tt, 'a' + n, .05, 'fade']); SCORE.push([tt, n]); ev(tt, 'tick');
});
// нормуємо, щоб перемотка тривала рівно FF_DUR
{ const all = SEQ.slice(-F.length), t0 = FF_START, t1 = all[all.length - 1][0], s = (FF_DUR - .35) / (t1 - t0);
  all.forEach(x => x[0] = t0 + (x[0] - t0) * s); TAPS.slice(-F.length).forEach(x => x[0] = t0 + (x[0] - t0) * s); SCORE.slice(-F.length).forEach(x => x[0] = t0 + (x[0] - t0) * s);
  EVENTS.filter(e => e.type === 'tick').forEach((e, i) => e.t = +all[i][0].toFixed(3)); }
ev(FF_START, 'rise');
SCORE.push([FF_START + FF_DUR - .05, 233 - DATA.LAST]); // слово перед «живими» вже зараховане
t = FF_START + FF_DUR;
const L0 = 233 - DATA.LAST + 1; const P2 = [1.0, .95, .95];
for (let n = L0; n < 233; n++, t += P2[n - L0 - 1] || .95) word(t, n, P2[n - L0] || .95);
// останнє слово — довше, з наближенням
const T_LAST = t, P3 = 1.6; word(T_LAST, 233, P3);
const T_TAP = T_LAST + P3 * .55, T_WIN = T_TAP + .6;
SEQ.push([T_WIN, 'win', .45, 'zoom']);
ev(T_TAP + .05, 'chime'); ev(T_WIN, 'tada'); ev(T_WIN + .5, 'pop');
TAPS.forEach(([tt, , fast]) => { if (!fast) ev(tt, 'tap'); });
ev(1.85, 'whoosh'); ev(0.35, 'whoosh');
const DURATION = T_WIN + 3.6;
const CURSOR_ON = [[1.0, 1.95], [2.3, T_WIN - .05]];

// ---------- DOM ----------
const layers = {};
for (const n in META) {
  const d = document.createElement('div'); d.className = 'layer';
  d.innerHTML = `<img src="work/m/s6/${n}.png"><div class="shade"></div>`;
  d.style.display = 'none'; $('screen').appendChild(d); layers[n] = d;
}
const cursor = document.createElement('div'); cursor.id = 'cursor'; $('screen').appendChild(cursor);
const ripples = TAPS.map(() => { const d = document.createElement('div'); d.className = 'ripple'; $('screen').appendChild(d); return d; });
const sparks = [];
TAPS.forEach(([tt, img, fast]) => {
  const m = fast ? 8 : 16;
  for (let i = 0; i < m; i++) {
    const d = document.createElement('div'); d.className = 'spark';
    d.style.background = ['#ffc46b', '#fff', '#FF7900', '#7ee081'][i % 4];
    $('screen').appendChild(d);
    sparks.push({ d, t: tt + .03, img, a: i / m * Math.PI * 2 + (i % 3) * .2, v: (fast ? 90 : 140) + (i * 37) % 110 });
  }
});
const conf = [];
for (let i = 0; i < 90; i++) {
  const d = document.createElement('div'); d.className = 'conf';
  d.style.background = ['#FF7900', '#4CAF50', '#ffffff', '#e6c200', '#ffc46b'][i % 5];
  $('cf').appendChild(d);
  const r = (i * 9301 + 49297) % 233280 / 233280, r2 = (i * 4271 + 1237) % 1000 / 1000;
  conf.push({ d, x: r * 1080, delay: r2 * .9, v: 520 + r * 420, sw: 40 + r2 * 60, rot: (r - .5) * 900, ph: i });
}

function setLayer(name, x, sc, shade, op) {
  const d = layers[name]; d.style.display = 'block';
  d.style.transform = `translate(${x}px,0) scale(${sc})`; d.style.opacity = op; d.lastChild.style.opacity = shade;
}
const btnPt = (img, fx = .5) => { const r = META[img].r.ok || META[img].r.go; return { x: (r.x + r.w * fx) * k, y: (r.y + r.h / 2) * k }; };

function render(t) {
  // фон
  $('dots').style.transform = `translate(${(t * 14) % 44}px,${(t * 22) % 44}px)`;
  $('b1').style.transform = `translate(${380 + Math.sin(t * .35) * 220}px,${1150 + Math.cos(t * .27) * 260}px)`;
  $('b2').style.transform = `translate(${-200 + Math.cos(t * .3) * 160}px,${300 + Math.sin(t * .22) * 200}px)`;
  $('logo').style.transform = `rotate(${Math.sin(t * 1.6) * 6}deg) scale(${1 + .15 * Math.max(0, 1 - Math.abs(t - T_WIN - .1) * 3)})`;
  $('logo').style.opacity = eout(prog(t, .1, .6));

  // телефон: виїжджає знизу; під час перемотки легко «тремтить»; на останньому слові — наближення
  const pin = eback(prog(t, .2, 1.1));
  const ff = prog(t, FF_START, FF_START + .3) * (1 - prog(t, FF_START + FF_DUR - .4, FF_START + FF_DUR));
  const zin = eio(prog(t, T_LAST - .3, T_LAST + .5)) * (1 - eio(prog(t, T_WIN, T_WIN + .6)));
  const py = lerp(1400, 0, pin) + Math.sin(t * 1.1) * 6 + ff * Math.sin(t * 47) * 3;
  $('phone').style.transform = `translateY(${py}px) rotate(${lerp(6, 0, pin) + ff * Math.sin(t * 31) * .4}deg) scale(${1 + zin * .1 + ff * .02})`;
  $('phone').style.filter = ff > .01 ? `blur(${ff * 1.2}px)` : 'none';

  // екран
  for (const n in layers) layers[n].style.display = 'none';
  let i = 0; SEQ.forEach((s, j) => { if (t >= s[0]) i = j; });
  const [t0, img, dur, kind] = SEQ[i], p = dur ? prog(t, t0, t0 + dur) : 1, e = eio(p);
  if (p < 1 && i > 0) {
    const pn = SEQ[i - 1][1];
    if (kind === 'push') { setLayer(pn, -e * 200, 1, e * .55, 1); setLayer(img, (1 - e) * 600, 1, 0, 1); layers[img].style.boxShadow = '-20px 0 40px rgba(0,0,0,.5)'; }
    else if (kind === 'zoom') { setLayer(pn, 0, 1, e * .6, 1); setLayer(img, 0, lerp(1.08, 1, eback(p)), 0, e); }
    else { setLayer(pn, 0, 1, 0, 1); setLayer(img, 0, 1, 0, e); }
  } else setLayer(img, 0, 1, 0, 1);

  // курсор-«пальчик»
  const on = CURSOR_ON.find(([a, b]) => t >= a && t <= b);
  cursor.style.display = on ? 'block' : 'none';
  if (on) {
    const taps = TAPS.filter(([tt]) => tt >= on[0] - .01 && tt <= on[1] + .01);
    let x = 470, y = 1100, prevT = on[0];
    for (const [tt, im, fast] of taps) {
      const q = btnPt(im, .5 + ((tt * 7) % 1 - .5) * .25), m = eio(prog(t, Math.max(prevT, tt - (fast ? .18 : .5)), tt - (fast ? .03 : .1)));
      x = lerp(x, q.x, m); y = lerp(y, q.y, m);
      // між натисканнями пальчик трохи відходить
      if (t > tt) { const up = Math.sin(Math.PI * prog(t, tt + .05, tt + (fast ? .12 : .4))); y += up * (fast ? 25 : 70); x += up * (fast ? 10 : 30); }
      prevT = tt + (fast ? .03 : .12);
      if (t < tt) break;
    }
    let press = 1; taps.forEach(([tt]) => { const d = t - tt; if (d > -.06 && d < .2) press = Math.min(press, .72 + .28 * Math.abs(d < 0 ? d / .06 : d / .2)); });
    const o = eout(prog(t, on[0], on[0] + .3)) * (1 - prog(t, on[1] - .25, on[1]));
    Object.assign(cursor.style, { left: x + 'px', top: y + 'px', opacity: o, transform: `scale(${press * lerp(1.5, 1, eout(prog(t, on[0], on[0] + .3)))})` });
  }
  TAPS.forEach(([tt, im, fast], j) => {
    const d = prog(t, tt, tt + (fast ? .35 : .55)), el = ripples[j];
    if (t < tt || d >= 1) { el.style.display = 'none'; return; }
    const q = btnPt(im), R = lerp(20, fast ? 100 : 150, eout(d));
    Object.assign(el.style, { display: 'block', left: q.x - R + 'px', top: q.y - R + 'px', width: R * 2 + 'px', height: R * 2 + 'px', opacity: 1 - d, borderWidth: lerp(10, 2, d) + 'px' });
  });
  sparks.forEach(sp => {
    const d = prog(t, sp.t, sp.t + .8);
    if (t < sp.t || d >= 1 || sp.img === 'modes') { sp.d.style.display = 'none'; return; }
    const q = btnPt(sp.img), dist = sp.v * eout(d) * 1.5;
    Object.assign(sp.d.style, { display: 'block', left: q.x + Math.cos(sp.a) * dist * 1.5 - 11 + 'px', top: q.y + Math.sin(sp.a) * dist * .8 + 40 * d * d - 11 + 'px', opacity: 1 - d * d, transform: `scale(${1 - d * .6})` });
  });

  // плашка з рахунком над телефоном: з'являється на перемотці, наприкінці — велике «233/233»
  let sc = 0; SCORE.forEach(([a, n]) => { if (t >= a) sc = n; });
  const ci = prog(t, FF_START - .2, FF_START + .25), win = t >= T_TAP;
  $('chip').style.display = t > FF_START - .2 ? 'block' : 'none';
  $('chip').innerHTML = win ? `🏆 <b>233/233</b>` : `${t < FF_START + FF_DUR - .2 ? '⏩' : '⭐'} <b>${sc}</b>/233`;
  const bump = SCORE.reduce((m, [a]) => Math.max(m, 1 - Math.abs(t - a - .05) / .12), 0);
  const big = eback(prog(t, T_TAP, T_TAP + .5));
  $('chip').style.transform = `translateX(-50%) translateY(${(1 - eback(ci)) * 60 - big * 30}px) scale(${eback(ci) * (1 + clamp(bump) * .06) * lerp(1, 1.45, big) * (1 + (win ? Math.sin((t - T_TAP) * 4) * .03 : 0))})`;
  $('chip').style.opacity = eout(ci);
  $('chip').style.boxShadow = win ? `0 10px 0 rgba(33,26,20,.35),0 0 ${40 + 20 * Math.sin(t * 5)}px rgba(255,196,107,.9)` : '0 10px 0 rgba(33,26,20,.35)';

  // конфеті на фінальному екрані
  conf.forEach(c => {
    const s = t - T_WIN - c.delay;
    if (s < 0) { c.d.style.display = 'none'; return; }
    const y = -60 + c.v * s + 60 * s * s, x = c.x + Math.sin(s * 3 + c.ph) * c.sw;
    c.d.style.display = y > 1980 ? 'none' : 'block';
    c.d.style.transform = `translate(${x}px,${y}px) rotate(${c.rot * s}deg) scaleX(${Math.cos(s * 6 + c.ph)})`;
  });
  document.body.style.opacity = 1;
}
window.render = render; window.EVENTS = EVENTS; window.DURATION = DURATION;
</script></body></html>
